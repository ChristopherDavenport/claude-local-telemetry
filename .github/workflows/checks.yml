name: checks

# Deterministic and free — no model, no network, no dependency on a real
# ~/.claude/projects — so it runs on every push rather than on demand.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Both, deliberately. The first bug CI ever caught on this project was
        # `mktemp -t`, a BSD spelling GNU rejects — green on macOS, broken on
        # Linux, and invisible to anyone developing on a Mac.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # node:sqlite and TypeScript type-stripping are both built in, so the
      # runtime needs nothing installed. This is only for tsc.
      - run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - name: Tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
