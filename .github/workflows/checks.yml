name: checks

# Deterministic and free — no model, no network, no dependency on a real
# ~/.claude/projects — so it runs on every push rather than on demand.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Both, deliberately. The first bug CI ever caught on this project was
        # `mktemp -t`, a BSD spelling GNU rejects — green on macOS, broken on
        # Linux, and invisible to anyone developing on a Mac.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      # node:sqlite and TypeScript type-stripping are both built in, so the
      # runtime needs nothing installed. This is only for tsc.
      - run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - name: Tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck

  ui:
    # One OS is enough here. The matrix above earns its cost on shell builtins
    # that differ between BSD and GNU; a Vite build has no such surface.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      # `npm ci`, not `npm install`, so this also asserts the lockfile is honest.
      # ui/.npmrc pins @jack-henry to public npm; without it this step resolves
      # a different registry than a Jack Henry laptop does, which is the whole
      # reason that file exists.
      - run: npm ci --no-audit --no-fund
      # `build` is `tsc --noEmit && vite build` — typecheck and bundle in one.
      - name: Typecheck and build
        run: npm run build
